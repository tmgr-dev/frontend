<!-- A page in its own window (contributes.views "window"): inline script and style only, no network. -->
<style>
	body { font: 14px system-ui; margin: 24px; }
</style>
<h1>Kitchen Sink window</h1>
<p id="count">Counting…</p>
<script>
	tmgr.tasks.list({ perPage: 1 }).then(({ total }) => {
		document.getElementById('count').textContent = `${total} tasks in this workspace`;
	});
</script>
