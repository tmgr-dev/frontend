<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Pair with TMGR</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--muted:#5b6370;--line:#e2e5ea;--accent:#2563eb;--on-accent:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#eef0f3;--muted:#98a1ae;--line:#2a303a;--accent:#6b9bff;--on-accent:#0e1116}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:420px;padding:28px 24px;background:var(--card);border:1px solid var(--line);border-radius:16px}
h1{margin:0 0 12px;font-size:22px;line-height:1.25}
p{margin:0 0 16px;color:var(--muted)}
ol{margin:0 0 24px;padding-left:22px}
li{margin:0 0 6px}
a{display:block;padding:12px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;text-align:center;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>Open TMGR on your phone</h1>
<p>This code pairs your phone with TMGR on your computer. Scan it from inside the app.</p>
<ol>
<li>Open the TMGR app on your iPhone.</li>
<li>Go to Settings, then Pair with desktop.</li>
<li>Scan the code shown on your computer.</li>
</ol>
<a href="https://tmgr.dev/">Get TMGR</a>
</main>
<script>history.replaceState(null,'','/pair')</script>
</body>
</html>
