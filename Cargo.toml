[workspace]
members = ["crates/*"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.80"
repository = "https://github.com/tmgr-dev/frontend"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
assert_cmd = "2"
tmgr-core = { path = "crates/tmgr-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
