[workspace]
members = ["crates/*"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"
repository = "https://github.com/tmgr-dev/frontend"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
assert_cmd = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.8"
keyring = "4"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3"
wiremock = "0.6"
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rpassword = "7"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
sha2 = "0.11"
hmac = "0.13"
ratatui = "0.30"
unicode-width = "0.2"
toml_edit = "0.22"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
form_urlencoded = "1"
percent-encoding = "2"
tmgr-core = { path = "crates/tmgr-core" }
tmgr-link = { path = "crates/tmgr-link" }
tmgr-ipc = { path = "crates/tmgr-ipc" }
tmgr-runner = { path = "crates/tmgr-runner" }
tmgr-usage = { path = "crates/tmgr-usage" }
tmgr-queue = { path = "crates/tmgr-queue" }
portable-pty = "0.9"
vt100 = "0.16"
vte = "0.15"
crossterm = "0.29"
regex = "1"
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
shell-words = "1"
subtle = "2"
landlock = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
