[package]
name = "tmgr-chat-relay"
description = "Client protocol of the zero-knowledge chat relay: device keys, wire format, sealing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = []
http = []

[dependencies]
tmgr-phone.workspace = true
tmgr-ipc.workspace = true
tmgr-spawn-auth.workspace = true
chrono.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
base64.workspace = true
subtle.workspace = true
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "sha256", "std"] }
