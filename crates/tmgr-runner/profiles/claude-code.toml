id = "claude-code"
name = "Claude Code"
command = ["claude"]
args = []
model_arg = ["--model", "{model}"]
env_pass = []
instruction_files = ["CLAUDE.md"]
tier = "t2"

[env]
DISABLE_AUTOUPDATER = "1"

[[secrets.files]]
from = "~/.config/tmgr/agents/claude-code.credentials.json"
to = ".claude/.credentials.json"
token_prefix = "sk-ant-oat01-"
template = "claude-oauth"

[sandbox]
read = ["~/.local/share/claude"]

[[sandbox.seed]]
from = "~/.claude.json"
to = ".claude.json"
json_keys = ["hasCompletedOnboarding", "theme", "oauthAccount"]

# Folder trust checked against a recorded Claude Code 2.1 screen (profiles/screens); tool-approval shapes still unverified.
[status]
blocked = [
  '(?i)do you want to (proceed|allow|make this edit)',
  '(?i)\ballow .+\?',
  '(?i)trust this folder',
]
idle = []

[prompt]
mode = "arg"
args = ["{prompt}"]

[resume]
args = ["--continue"]

[hooks]
kind = "settings-file"

[permission_modes]
ask = ["--permission-mode", "manual"]
accept-edits = ["--permission-mode", "acceptEdits"]
plan = ["--permission-mode", "plan"]
