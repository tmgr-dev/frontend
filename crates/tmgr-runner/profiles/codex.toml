id = "codex"
name = "Codex"
command = ["codex"]
args = ["--no-daemon"]
model_arg = ["--model", "{model}"]
env_pass = []

[[sandbox.seed]]
from = "~/.codex/auth.json"
to = ".codex/auth.json"

# Checked against recorded Codex 0.157 screens in profiles/screens (approval prompt, folder trust).
[status]
blocked = [
  '(?i)(approve|allow) (this|the) (command|change|edit)',
  '(?i)\ballow .+\?',
  '(?i)trust this folder',
]
idle = []
