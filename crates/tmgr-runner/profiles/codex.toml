id = "codex"
name = "Codex"
command = ["codex"]
args = ["--no-daemon"]
model_arg = ["--model", "{model}"]
env_pass = []
instruction_files = ["AGENTS.md"]
tier = "t2"

# Codex rotates its tokens after ~8 days; 7 leaves a margin. A refreshed login becomes a candidate, applied with `tmgr agents sync codex`.
[[sandbox.seed]]
from = "~/.codex/auth.json"
to = ".codex/auth.json"
fresh = { json_key = "last_refresh", max_age_days = 7 }
write_back = true
same = ["tokens.account_id", "auth_mode"]

# Checked against recorded Codex 0.157 screens in profiles/screens; the approval UI lines are stable, the "Reason" text is model-written.
[status]
blocked = [
  '(?i)(approve|allow) (this|the) (command|change|edit)',
  '(?i)\ballow .+\?',
  '(?i)trust this folder',
  '(?i)would you like to run the following command\?',
  '(?i)press enter to confirm or esc to cancel',
]
idle = []

[prompt]
mode = "arg"
args = ["{prompt}"]

[resume]
args = ["resume", "--last"]
at = "after_command"

[hooks]
kind = "config-override"
