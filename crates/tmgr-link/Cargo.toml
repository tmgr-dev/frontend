[package]
name = "tmgr-link"
description = "Leader to follower link for the TMGR runner (groundwork)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
toml.workspace = true
chrono.workspace = true
sha2.workspace = true
tempfile.workspace = true
tmgr-core.workspace = true
tmgr-ipc.workspace = true
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
libc.workspace = true
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash", "std"] }

[dev-dependencies]
keyring.workspace = true
regex.workspace = true
shell-words.workspace = true
tmgr-runner.workspace = true
