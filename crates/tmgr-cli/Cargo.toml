[package]
name = "tmgr-cli"
description = "Command line interface for TMGR"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tmgr"
path = "src/main.rs"

[features]
runner = ["dep:tmgr-runner", "dep:tmgr-queue", "dep:shell-words", "dep:libc", "dep:tmgr-local", "dep:rusqlite", "dep:tmgr-chat-relay", "dep:reqwest"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tmgr-core.workspace = true
tmgr-fuzzy.workspace = true
tmgr-link.workspace = true
tmgr-usage.workspace = true
tmgr-session.workspace = true
ctrlc.workspace = true
rpassword.workspace = true
chrono.workspace = true
iana-time-zone = "0.1"
tempfile.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
toml_edit.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "std"] }
tmgr-runner = { workspace = true, optional = true }
tmgr-ipc = { workspace = true }
tmgr-queue = { workspace = true, optional = true }
shell-words = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
tmgr-local = { path = "../tmgr-local", optional = true }
rusqlite = { workspace = true, optional = true }
tmgr-chat-relay = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
keyring.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
wiremock.workspace = true
tokio.workspace = true
jsonschema.workspace = true
portable-pty.workspace = true
vt100.workspace = true
rusqlite.workspace = true
tmgr-local = { path = "../tmgr-local" }
keyring.workspace = true
