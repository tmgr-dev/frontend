[package]
name = "tmgr-cli"
description = "Command line interface for TMGR"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tmgr"
path = "src/main.rs"

[features]
runner = ["dep:tmgr-runner", "dep:tmgr-ipc", "dep:shell-words", "dep:libc"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tmgr-core.workspace = true
tmgr-link.workspace = true
ctrlc.workspace = true
rpassword.workspace = true
chrono.workspace = true
iana-time-zone = "0.1"
tempfile.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
toml_edit.workspace = true
tmgr-runner = { workspace = true, optional = true }
tmgr-ipc = { workspace = true, optional = true }
shell-words = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
wiremock.workspace = true
tokio.workspace = true
jsonschema.workspace = true
sha2.workspace = true
portable-pty.workspace = true
vt100.workspace = true
