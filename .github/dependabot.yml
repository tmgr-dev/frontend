version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # `tauri build` fails when the npm and Rust Tauri packages differ in major/minor,
    # and npm and cargo updates arrive as separate PRs. Move them together by hand.
    ignore:
      - dependency-name: '@tauri-apps/*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']

  # Root workspace (crates/). src-tauri is excluded from it and has its own lockfile.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-crates-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-tauri-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must stay on the same major/minor as @tauri-apps/* (see the npm entry).
      - dependency-name: 'tauri'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'tauri-build'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'tauri-plugin-*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # Exact pin to the copy notify-rust pulls in; move it together with notify-rust.
      - dependency-name: 'mac-notification-sys'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
