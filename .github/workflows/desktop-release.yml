name: Desktop release

on:
  push:
    tags:
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  macos:
    name: build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: check tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "desktop-v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src-tauri/tauri.conf.json version $APP_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Tauri treats a set-but-empty APPLE_* variable as configured, so only export the ones that have values.
      - name: export Apple signing env
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__VALUE__"; echo "${!name}"; echo "__VALUE__"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TMGR Desktop v__VERSION__'
          releaseBody: 'Download the .dmg below. Installed apps update themselves.'
          releaseDraft: false
          prerelease: false
