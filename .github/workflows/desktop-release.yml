name: Desktop release

on:
  push:
    tags:
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  macos:
    name: build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: check tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "desktop-v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src-tauri/tauri.conf.json version $APP_VERSION"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: release notes from src-tauri/CHANGELOG.md
        run: |
          awk -v v="$APP_VERSION" '/^## /{p = ($2 == v); next} p' src-tauri/CHANGELOG.md \
            | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::src-tauri/CHANGELOG.md has no '## $APP_VERSION' section"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # The only step that sees signing secrets. Tauri treats a set-but-empty APPLE_* variable
      # as configured, so empty ones are dropped before the build.
      - name: build and sign
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npx tauri build

      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE=src-tauri/target/release/bundle
          OUT=release
          mkdir -p "$OUT"
          cp "$BUNDLE/dmg/TMGR_${APP_VERSION}_aarch64.dmg" "$OUT/"
          UPDATE="TMGR_${APP_VERSION}_aarch64.app.tar.gz"
          cp "$BUNDLE/macos/TMGR.app.tar.gz" "$OUT/$UPDATE"
          cp "$BUNDLE/macos/TMGR.app.tar.gz.sig" "$OUT/$UPDATE.sig"
          jq -n \
            --arg version "$APP_VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$OUT/$UPDATE.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$UPDATE" \
            --rawfile notes "$RUNNER_TEMP/notes.md" \
            '{version: $version, pub_date: $date, notes: $notes, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$OUT/latest.json"
          gh release create "$GITHUB_REF_NAME" "$OUT"/* \
            --title "TMGR Desktop v$APP_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
