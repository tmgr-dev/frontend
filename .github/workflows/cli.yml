name: CLI

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'public/install.sh'
      - 'rust-toolchain.toml'
      - '.github/workflows/cli.yml'
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'public/install.sh'
      - 'rust-toolchain.toml'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo clippy -p tmgr-cli --features runner --all-targets --locked -- -D warnings

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        # macOS slots are scarce and shared with release work: x86_64 runs only on master, Dependabot PRs skip macOS.
        include: >-
          ${{ fromJSON(github.event.pull_request.user.login == 'dependabot[bot]'
          && '[{"name":"linux-x86_64","runner":"ubuntu-latest","target":""},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","target":""}]'
          || github.event_name == 'pull_request'
          && '[{"name":"linux-x86_64","runner":"ubuntu-latest","target":""},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","target":""},{"name":"macos-arm64","runner":"macos-latest","target":""}]'
          || '[{"name":"linux-x86_64","runner":"ubuntu-latest","target":""},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","target":""},{"name":"macos-arm64","runner":"macos-latest","target":""},{"name":"macos-x86_64","runner":"macos-latest","target":"x86_64-apple-darwin"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.name }}

      - name: test
        timeout-minutes: 30
        env:
          TARGET: ${{ matrix.target }}
          TMGR_BUILD_COMMIT: ${{ github.sha }}
        run: |
          umask 002
          cargo test --workspace --locked --no-fail-fast ${TARGET:+--target "$TARGET"}

      - name: test runner feature
        timeout-minutes: 20
        env:
          TARGET: ${{ matrix.target }}
          TMGR_BUILD_COMMIT: ${{ github.sha }}
        run: cargo test -p tmgr-cli --features runner --locked ${TARGET:+--target "$TARGET"}
