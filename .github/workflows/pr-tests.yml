name: Tests

on:
  pull_request:
  push:
    branches:
      - master

# The repo is public: fork pull requests must never reach a secret. This
# workflow reads nothing but the code, so it is safe to run on their head.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --ci

      - name: Type check
        run: npm run typecheck

      # The tree was reformatted once (8878); this keeps the drift from coming back.
      - name: Format check
        run: npx prettier . --check

      # No .env: every VITE_* var is optional at build time, and a fork PR gets
      # no secrets anyway. This proves the bundle compiles, not that it is
      # configured — deployment builds pass the real values as build args.
      - name: Production build
        run: npm run build

  clippy:
    name: Clippy (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxdo-dev libssl-dev

      # Pinned so a new stable with new lints doesn't turn every PR red overnight.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.99'
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
