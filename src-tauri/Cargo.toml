[package]
name = "tmgr"
version = "0.9.12"
description = "TMGR desktop app"
authors = ["TMGR"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tmgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Real-build containment check for plugin windows (npm run test:desktop-isolation). Never in release builds.
isolation-selftest = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
sha2 = "0.10"
minisign-verify = "0.2"
url = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "io-util", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
# Same copy notify-rust already pulls in; exposes the click callback notify-rust does not.
mac-notification-sys = "=0.6.15"
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
